[package]
name = "vortex-board"
description = "Vortexes board governance: a set of signers propose and confirm; a proposal runs once enough of them confirm. No token."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "vortex_board"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
custom-heap = []
custom-panic = []
anchor-debug = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "vortex-core/idl-build", "vortex-hub/idl-build"]

[dependencies]
anchor-lang = { workspace = true, features = ["init-if-needed"] }
vortex-core = { path = "../../crates/vortex-core" }
vortex-hub = { path = "../hub", features = ["cpi"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
