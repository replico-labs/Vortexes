[package]
name = "vortex-hub"
description = "Vortexes hub: every DAO's record and treasury, the approved governance models, running passed proposals, and switching a DAO's governance."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "vortex_hub"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
custom-heap = []
custom-panic = []
anchor-debug = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "vortex-core/idl-build"]

[dependencies]
anchor-lang = { workspace = true, features = ["init-if-needed"] }
vortex-core = { path = "../../crates/vortex-core" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
