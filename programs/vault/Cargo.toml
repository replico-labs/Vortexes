[package]
name = "vortex-vault"
description = "Vortexes prop-firm vault: a prop-firm DAO's pooled fund, whose shares are the DAO's own token. Deposits and redemptions are priced together at windows, at a value the program computes itself from Phoenix's accounts."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "vortex_vault"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
custom-heap = []
custom-panic = []
anchor-debug = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { workspace = true, features = ["init-if-needed"] }
anchor-spl = { workspace = true }
vortex-core = { path = "../../crates/vortex-core" }
vortex-hub = { path = "../hub", features = ["cpi"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
