[package]
name = "vortex-sowellian"
description = "Vortexes Sowellian governance: approved success criteria, a YES/NO market, oracle or challengeable human resolution."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "vortex_sowellian"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
custom-heap = []
custom-panic = []
anchor-debug = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "vortex-core/idl-build", "vortex-hub/idl-build"]

[dependencies]
anchor-lang = { workspace = true, features = ["init-if-needed"] }
anchor-spl = { workspace = true }
vortex-core = { path = "../../crates/vortex-core" }
vortex-hub = { path = "../hub", features = ["cpi"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
