[package]
name = "vortex-fill"
description = "Vortexes fill: a DAO swaps through any route without trusting whoever runs it. The treasury posts tokens with a minimum to receive and a deadline; a keeper takes them and swaps in its own transaction, which only lands if the minimum reaches the order."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "vortex_fill"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
custom-heap = []
custom-panic = []
anchor-debug = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
solana-instructions-sysvar = "3.0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
